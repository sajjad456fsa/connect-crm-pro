services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: connectcrm
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    env_file:
      - ./backend/.env
    volumes:
      - ./backend:/usr/src/app
      - backend_modules:/usr/src/app/node_modules
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - ./frontend/.env
    volumes:
      - ./frontend:/usr/src/app
      - frontend_modules:/usr/src/app/node_modules
      - frontend_next:/usr/src/app/.next
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  db-data:
  backend_modules:
  frontend_modules:
  frontend_next:
